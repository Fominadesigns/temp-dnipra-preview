<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Адаптив-тест</title>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #111; color: #eee; padding: 16px; margin: 0; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  #nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; position: sticky; top: 0; background: #111; padding: 10px 0; z-index: 10; border-bottom: 1px solid #333; }
  #nav button { background: #222; color: #eee; border: 1px solid #444; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  #nav button:hover { background: #FFBE00; color: #111; border-color: #FFBE00; }
  .wrap { display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; padding-bottom: 16px; }
  .col { border: 1px solid #444; flex: none; }
  .col h3 { font-size: 12px; padding: 6px; margin: 0; background: #222; font-family: monospace; }
  iframe { border: 0; display: block; height: 900px; }
  #out { white-space: pre; margin-top: 20px; font-size: 12px; font-family: monospace; color: #9f9; }
</style>
</head>
<body>
<h2>Тест адаптиву — версія 2 (оновлений дизайн)</h2>

<div id="nav"></div>
<div class="wrap" id="wrap"></div>
<div id="out">Перевірка полів працює лише на github.io (локально браузер блокує доступ між файлами).</div>

<script>
var WIDTHS  = [320, 375, 412, 540, 600, 768, 1024, 1280, 1440];
var SECTIONS = [
  ['Головний екран', 'hero'],
  ['Переваги',       'screen3'],
  ['Зручності',      'screen4'],
  ['Басейн',         'screen5'],
  ['Будиночки',      'screen6'],
  ['Чани',           'screen7'],
  ['Хвостики',       'screen9'],
  ['Відгуки',        'screen10'],
  ['Контакти',       'screen8'],
  ['Футер',          'site-footer']
];

var wrap = document.getElementById('wrap');
WIDTHS.forEach(function (w) {
  var col = document.createElement('div');
  col.className = 'col';
  col.innerHTML = '<h3>' + w + 'px</h3>';
  var f = document.createElement('iframe');
  f.src = 'index-v2.html';
  f.width = w;
  f.setAttribute('data-w', w);
  col.appendChild(f);
  wrap.appendChild(col);
});

var nav = document.getElementById('nav');
SECTIONS.forEach(function (sec) {
  var b = document.createElement('button');
  b.textContent = sec[0];
  b.addEventListener('click', function () {
    document.querySelectorAll('iframe').forEach(function (f) {
      f.src = 'index-v2.html#' + sec[1];
    });
  });
  nav.appendChild(b);
});

var reset = document.createElement('button');
reset.textContent = '↺ Перезавантажити все';
reset.addEventListener('click', function () {
  document.querySelectorAll('iframe').forEach(function (f) {
    f.src = 'index-v2.html?t=' + Date.now();
  });
});
nav.appendChild(reset);

function report() {
  var out = [];
  document.querySelectorAll('iframe').forEach(function (f) {
    var w = f.getAttribute('data-w');
    try {
      var d = f.contentDocument;
      if (!d) { out.push(w + 'px: немає доступу'); return; }
      var de = d.documentElement;
      var overflow = de.scrollWidth - de.clientWidth;
      var offenders = [];
      if (overflow > 1) {
        d.querySelectorAll('body *').forEach(function (el) {
          var r = el.getBoundingClientRect();
          if (r.width > 0 && (r.right > de.clientWidth + 1 || r.left < -1)) {
            if (f.contentWindow.getComputedStyle(el).position === 'fixed') return;
            offenders.push(
              (el.id ? '#' + el.id : el.className ? '.' + String(el.className).split(' ')[0] : el.tagName) +
              ' [' + Math.round(r.left) + '→' + Math.round(r.right) + ']'
            );
          }
        });
      }
      out.push(w + 'px: scrollW=' + de.scrollWidth + ' clientW=' + de.clientWidth +
        ' overflow=' + overflow + (offenders.length ? '\n    ' + offenders.slice(0, 8).join('\n    ') : ' ✓'));
    } catch (e) {
      out.push(w + 'px: локальний режим — перевірка недоступна');
    }
  });
  document.getElementById('out').textContent = out.join('\n');
}
window.addEventListener('load', function () { setTimeout(report, 3000); });
</script>
</body>
</html>
